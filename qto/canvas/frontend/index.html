<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; font-family: "Source Sans Pro", system-ui, sans-serif; user-select: none; }
  #wrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: #cbd5e1;
          border-radius: 12px; border: 1px solid #94a3b8; box-sizing: border-box; }
  canvas { display: block; outline: none; }
  .panel { position: absolute; background: rgba(15, 23, 42, .88); color: #fff; border-radius: 10px;
           font-size: 13px; line-height: 1.45; }
  #hud { left: 10px; top: 10px; padding: 7px 11px; pointer-events: none; max-width: 34%; }
  #hud b { color: #7dd3fc; }
  #tools { right: 10px; top: 10px; padding: 5px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 62%; }
  #tools button { background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 7px; padding: 4px 8px;
                  cursor: pointer; font-size: 12.5px; white-space: nowrap; }
  #tools button:hover { background: #2563eb; }
  #tools button.on { background: #2563eb; border-color: #93c5fd; }
  #tools .sep { width: 1px; background: #475569; margin: 3px 3px; }
  #tip { left: 10px; bottom: 10px; padding: 5px 10px; font-size: 12px; opacity: .9; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" tabindex="0"></canvas>
  <div id="hud" class="panel"></div>
  <div id="tools" class="panel">
    <button id="pan" title="Pan: drag the drawing with the left mouse button (P). Right or middle drag, or Space + drag, always pans.">🖐 Pan</button>
    <button id="zwin" title="Zoom window: drag a box around the part to enlarge (W)">🔍 Window</button>
    <button id="zin" title="Zoom in (+ or mouse wheel)">＋</button>
    <button id="zout" title="Zoom out (− or mouse wheel)">－</button>
    <button id="zext" title="Zoom extents: fit to the drawn content and measurements (E)">⛶ Extents</button>
    <button id="zall" title="Zoom all: show the whole sheet (A)">⤢ All</button>
    <span class="sep"></span>
    <button id="undo" title="Remove last point (Backspace)">↶ Undo</button>
    <button id="finish" title="Finish measurement (Enter)">✔ Finish</button>
    <button id="cancel" title="Cancel (Esc)">✕</button>
  </div>
  <div id="tip" class="panel"></div>
</div>
<script>
// Minimal Streamlit component protocol (same messages streamlit-component-lib sends).
const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
const setValue = (value) => send("streamlit:setComponentValue", { value, dataType: "json" });

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const hud = document.getElementById("hud");
const tip = document.getElementById("tip");

let args = null, img = null, imgKey = null, autoFit = true;  // keep fitting to the frame until the user zooms or pans
let view = { s: 1, x: 0, y: 0 };      // screen = image * s + (x, y)
let pts = [];                          // points of the measurement in progress (image px)
let mouse = null, snapHit = null, selected = null;
let pan = null, spaceDown = false, shiftDown = false, lastMode = null;
let grid = null, gridCell = 24;
let navTool = null, win = null, inkBox = null;  // navTool: null | "pan" | "window"; win: zoom-window drag box (screen px)

const TIPS = {
  count: "Click each item to count · Enter or ✔ Finish to save · Backspace undo · Esc cancel",
  line: "Click points along the run · double-click or Enter to finish · Shift = straight · Esc cancel",
  area: "Click the corners · double-click or Enter to close the area · Shift = straight · Esc cancel",
  calibrate: "Click both ends of a dimension you know, e.g. a grid line or a dimensioned wall",
  select: "Click a measurement to select it · Delete removes it · drag to pan",
};

window.addEventListener("message", (e) => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const a = e.data.args;
  args = a;
  send("streamlit:setFrameHeight", { height: a.height || 700 });
  if (a.image_key !== imgKey) {
    imgKey = a.image_key;
    autoFit = true;
    const next = new Image();
    next.onload = () => { img = next; inkBox = inkExtents(next); resize(); fit(); draw(); };
    next.src = a.image;
  }
  if (a.mode !== lastMode) { pts = []; lastMode = a.mode; }
  buildGrid(a.snap || []);
  selected = a.selected || null;
  tip.textContent = TIPS[a.mode] || "";
  draw();
});

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener("resize", () => { resize(); if (autoFit) fit(); draw(); });

// Free drawing area between the toolbar at the top and the tip bar at the bottom (screen px).
function freeArea() {
  const top = Math.min(document.getElementById("tools").offsetHeight + 16, canvas.height * 0.3);
  const bottom = Math.min(tip.offsetHeight + 16, canvas.height * 0.2);
  return { top, height: Math.max(canvas.height - top - bottom, 50) };
}
function fit() {
  if (img) zoomToBox(0, 0, img.width, img.height, 0.01, true);
}
function zoomToBox(x0, y0, x1, y1, margin, keepAutoFit) {
  const w = Math.max(x1 - x0, 1), h = Math.max(y1 - y0, 1), m = margin || 0.04, area = freeArea();
  const s = Math.min(canvas.width / (w * (1 + 2 * m)), area.height / (h * (1 + 2 * m)));
  if (!keepAutoFit) autoFit = false;
  view = { s: Math.max(0.02, Math.min(s, 40)), x: 0, y: 0 };
  view.x = canvas.width / 2 - ((x0 + x1) / 2) * view.s;
  view.y = area.top + area.height / 2 - ((y0 + y1) / 2) * view.s;
  draw();
}
// Bounding box of the drawn content: dark pixels of the sheet, found on a reduced copy of the image.
function inkExtents(image) {
  try {
    const k = Math.min(1, 900 / Math.max(image.width, image.height));
    const w = Math.max(1, Math.round(image.width * k)), h = Math.max(1, Math.round(image.height * k));
    const off = document.createElement("canvas"); off.width = w; off.height = h;
    const g = off.getContext("2d"); g.drawImage(image, 0, 0, w, h);
    const d = g.getImageData(0, 0, w, h).data;
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (Math.min(d[i], d[i + 1], d[i + 2]) < 200) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    return x1 < 0 ? null : [x0 / k, y0 / k, (x1 + 1) / k, (y1 + 1) / k];
  } catch (err) { return null; }
}
function zoomExtents() {
  let box = inkBox ? inkBox.slice() : null;
  const grow = (x, y) => { if (!box) box = [x, y, x, y]; else { box[0] = Math.min(box[0], x); box[1] = Math.min(box[1], y); box[2] = Math.max(box[2], x); box[3] = Math.max(box[3], y); } };
  const snapPts = (args && args.snap) || [];
  if (!inkBox) for (let i = 0; i + 1 < snapPts.length; i += 2) grow(snapPts[i], snapPts[i + 1]);
  ((args && args.shapes) || []).forEach((sh) => sh.points.forEach((q) => grow(q[0], q[1])));
  if (box) zoomToBox(box[0], box[1], box[2], box[3], 0.03); else { autoFit = true; fit(); draw(); }
}
function setNav(tool) {
  navTool = navTool === tool ? null : tool;
  win = null;
  document.getElementById("pan").classList.toggle("on", navTool === "pan");
  document.getElementById("zwin").classList.toggle("on", navTool === "window");
  updateCursor();
}
function updateCursor() {
  const mode = args ? args.mode : "select";
  canvas.style.cursor = pan ? "grabbing" : navTool === "pan" ? "grab" : navTool === "window" ? "zoom-in"
    : mode === "select" ? "default" : "crosshair";
}
function toImage(sx, sy) { return [(sx - view.x) / view.s, (sy - view.y) / view.s]; }
function toScreen(p) { return [p[0] * view.s + view.x, p[1] * view.s + view.y]; }
function zoomAt(sx, sy, f) {
  autoFit = false;
  const [ix, iy] = toImage(sx, sy);
  view.s = Math.max(0.02, Math.min(view.s * f, 40));
  view.x = sx - ix * view.s;
  view.y = sy - iy * view.s;
  draw();
}

// ---- snapping to line ends and corners of the vector drawing
function buildGrid(flat) {
  if (grid && grid.src === flat.length) return;
  grid = new Map(); grid.src = flat.length;
  for (let i = 0; i + 1 < flat.length; i += 2) {
    const k = Math.floor(flat[i] / gridCell) + "," + Math.floor(flat[i + 1] / gridCell);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push([flat[i], flat[i + 1]]);
  }
}
function snap(p) {
  if (!grid || !args || !args.snap_on) return null;
  const r = 10 / view.s;
  const cx = Math.floor(p[0] / gridCell), cy = Math.floor(p[1] / gridCell), span = Math.ceil(r / gridCell);
  let best = null, bd = r;
  for (let i = -span; i <= span; i++) for (let j = -span; j <= span; j++) {
    for (const q of grid.get((cx + i) + "," + (cy + j)) || []) {
      const d = Math.hypot(q[0] - p[0], q[1] - p[1]);
      if (d < bd) { bd = d; best = q; }
    }
  }
  return best;
}
function ortho(p) {
  if (!shiftDown || !pts.length) return p;
  const last = pts[pts.length - 1];
  return Math.abs(p[0] - last[0]) > Math.abs(p[1] - last[1]) ? [p[0], last[1]] : [last[0], p[1]];
}
function cursorPoint(sx, sy) {
  const raw = toImage(sx, sy);
  snapHit = snap(raw);
  return ortho(snapHit || raw);
}

// ---- geometry
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const polyLength = (p) => p.slice(1).reduce((s, q, i) => s + dist(p[i], q), 0);
const polyArea = (p) => Math.abs(p.reduce((s, q, i) => { const n = p[(i + 1) % p.length]; return s + q[0] * n[1] - n[0] * q[1]; }, 0)) / 2;
function fmt(v, unit) { return v.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + " " + unit; }

function readout() {
  if (!args) return "";
  const m = args.m_per_px;
  const live = mouse && pts.length && args.mode !== "count" && args.mode !== "select" ? pts.concat([mouse]) : pts;
  const scale = m ? "" : " · <b>scale not set</b>";
  if (args.mode === "count") return `<b>${args.item || "Count"}</b> · ${pts.length} nr`;
  if (args.mode === "line" || args.mode === "calibrate") {
    const len = polyLength(live);
    return `<b>${args.mode === "calibrate" ? "Calibrate" : args.item || "Length"}</b> · ` + (m ? fmt(len * m, "m") : fmt(len, "px")) + scale;
  }
  if (args.mode === "area") {
    const a = live.length > 2 ? polyArea(live) : 0, per = live.length > 1 ? polyLength(live.concat([live[0]])) : 0;
    return `<b>${args.item || "Area"}</b> · ` + (m ? fmt(a * m * m, "m²") + " · perimeter " + fmt(per * m, "m") : fmt(a, "px²")) + scale;
  }
  return m ? "Select / pan" : "Select / pan" + scale;
}

// ---- drawing
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function path(p, close) {
  ctx.beginPath();
  p.forEach((q, i) => { const [x, y] = toScreen(q); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
  if (close) ctx.closePath();
}
function drawShape(sh, active) {
  const c = sh.color || "#e11d48", sel = active || sh.id === selected;
  ctx.save();
  if (sh.deduct) ctx.setLineDash([8, 5]);
  if (sh.type === "count") {
    sh.points.forEach((q, i) => {
      const [x, y] = toScreen(q);
      ctx.beginPath(); ctx.arc(x, y, sel ? 9 : 7, 0, Math.PI * 2);
      ctx.fillStyle = c; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(i + 1), x, y + 0.5);
    });
  } else if (sh.type === "area") {
    path(sh.points, true);
    ctx.fillStyle = hexA(sh.deduct ? "#dc2626" : c, sel ? 0.42 : 0.28); ctx.fill();
    ctx.lineWidth = sel ? 4 : 2.5; ctx.strokeStyle = sh.deduct ? "#dc2626" : c; ctx.stroke();
  } else {
    path(sh.points, false);
    if (sel) { ctx.lineWidth = 9; ctx.strokeStyle = hexA(c, 0.35); ctx.stroke(); }
    ctx.lineWidth = 3.5; ctx.strokeStyle = sh.deduct ? "#dc2626" : c; ctx.stroke();
  }
  if (sh.label && sh.points.length) {
    const cx = sh.points.reduce((s, q) => s + q[0], 0) / sh.points.length;
    const cy = sh.points.reduce((s, q) => s + q[1], 0) / sh.points.length;
    const [x, y] = toScreen(sh.type === "count" ? sh.points[0] : [cx, cy]);
    ctx.setLineDash([]); ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    const w = ctx.measureText(sh.label).width + 8;
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.fillRect(x + 8, y - 20, w, 17);
    ctx.fillStyle = c; ctx.fillText(sh.label, x + 12, y - 5);
  }
  ctx.restore();
}
function draw() {
  if (!canvas.width) resize();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#cbd5e1"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (img) {
    ctx.imageSmoothingEnabled = view.s < 1;
    ctx.drawImage(img, view.x, view.y, img.width * view.s, img.height * view.s);
  }
  if (args) (args.shapes || []).forEach((sh) => drawShape(sh, false));
  if (args && pts.length) {
    const mode = args.mode, c = mode === "calibrate" ? "#0ea5e9" : args.color || "#e11d48";
    const live = mouse && mode !== "count" ? pts.concat([mouse]) : pts;
    drawShape({ type: mode === "calibrate" ? "line" : mode, points: live, color: c, deduct: false }, true);
  }
  if (snapHit && !navTool) {
    const [x, y] = toScreen(snapHit);
    ctx.strokeStyle = "#0ea5e9"; ctx.lineWidth = 2; ctx.strokeRect(x - 6, y - 6, 12, 12);
  }
  if (win) {
    ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 1.5; ctx.strokeStyle = "#2563eb"; ctx.fillStyle = "rgba(37,99,235,.08)";
    const x = Math.min(win.x0, win.x1), y = Math.min(win.y0, win.y1), w = Math.abs(win.x1 - win.x0), h = Math.abs(win.y1 - win.y0);
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h); ctx.restore();
  }
  hud.innerHTML = readout();
  updateCursor();
}

// ---- hit test for select mode
function segDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l2)) : 0;
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}
function inside(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > p[1]) !== (yj > p[1]) && p[0] < ((xj - xi) * (p[1] - yi)) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function hit(p) {
  const tol = 8 / view.s, shapes = (args && args.shapes) || [];
  for (let k = shapes.length - 1; k >= 0; k--) {
    const sh = shapes[k];
    if (sh.type === "count" && sh.points.some((q) => dist(q, p) < tol * 1.3)) return sh.id;
    if (sh.type !== "count") {
      const ring = sh.type === "area" ? sh.points.concat([sh.points[0]]) : sh.points;
      for (let i = 1; i < ring.length; i++) if (segDist(p, ring[i - 1], ring[i]) < tol) return sh.id;
    }
  }
  for (let k = shapes.length - 1; k >= 0; k--) if (shapes[k].type === "area" && inside(p, shapes[k].points)) return shapes[k].id;
  return null;
}

// ---- finishing and events sent to Python
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dedupe(p) { return p.filter((q, i) => i === 0 || dist(q, p[i - 1]) > 0.5); }
function finish() {
  if (!args) return;
  const mode = args.mode;
  pts = mode === "count" ? pts : dedupe(pts);
  const need = { count: 1, line: 2, area: 3, calibrate: 2 }[mode];
  if (!need || pts.length < need) return;
  setValue({ event: mode === "calibrate" ? "calibrate" : "add", kind: mode, points: pts.map((q) => [+q[0].toFixed(2), +q[1].toFixed(2)]), id: uid() });
  pts = []; draw();
}

canvas.addEventListener("contextmenu", (e) => e.preventDefault());
canvas.addEventListener("wheel", (e) => { e.preventDefault(); zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.2 : 1 / 1.2); }, { passive: false });
canvas.addEventListener("mousedown", (e) => {
  canvas.focus({ preventScroll: true });
  const mode = args ? args.mode : "select";
  if (e.button === 0 && navTool === "window") {
    win = { x0: e.offsetX, y0: e.offsetY, x1: e.offsetX, y1: e.offsetY };
    return;
  }
  if (e.button !== 0 || spaceDown || navTool === "pan" || (mode === "select" && !hit(toImage(e.offsetX, e.offsetY)))) {
    pan = { sx: e.offsetX, sy: e.offsetY, x: view.x, y: view.y, moved: false };
    return;
  }
  if (mode === "select") {
    const id = hit(toImage(e.offsetX, e.offsetY));
    selected = id; draw();
    if (id) setValue({ event: "select", shape: id, id: uid() });
    return;
  }
  const p = cursorPoint(e.offsetX, e.offsetY);
  pts.push(p);
  if (mode === "calibrate" && pts.length === 2) finish();
  draw();
});
canvas.addEventListener("mousemove", (e) => {
  if (win) { win.x1 = e.offsetX; win.y1 = e.offsetY; draw(); return; }
  if (pan) {
    view.x = pan.x + e.offsetX - pan.sx; view.y = pan.y + e.offsetY - pan.sy; pan.moved = true; autoFit = false; draw(); return;
  }
  mouse = args && args.mode !== "select" && !navTool ? cursorPoint(e.offsetX, e.offsetY) : null;
  if (navTool) snapHit = null;
  draw();
});
window.addEventListener("mouseup", () => {
  if (win) {
    const box = win, w = Math.abs(box.x1 - box.x0), h = Math.abs(box.y1 - box.y0);
    setNav("window");  // one window per click of the button, then back to measuring (also clears the box)
    if (w > 8 && h > 8) {
      const a = toImage(Math.min(box.x0, box.x1), Math.min(box.y0, box.y1));
      const b = toImage(Math.max(box.x0, box.x1), Math.max(box.y0, box.y1));
      zoomToBox(a[0], a[1], b[0], b[1], 0.01);
    } else {
      zoomAt(box.x0, box.y0, 2);  // a plain click with the window tool zooms in on that spot
    }
    return;
  }
  pan = null;
  draw();
});
canvas.addEventListener("mouseleave", () => { mouse = null; snapHit = null; draw(); });
canvas.addEventListener("dblclick", () => { if (args && (args.mode === "line" || args.mode === "area")) finish(); });
canvas.addEventListener("keydown", (e) => {
  if (e.key === "Shift") shiftDown = true;
  if (e.key === " ") { spaceDown = true; e.preventDefault(); }
  if (e.key === "Enter") finish();
  if (e.key === "Escape") { if (navTool) setNav(navTool); else pts = []; draw(); }
  if (!e.ctrlKey && !e.metaKey && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "p") setNav("pan");
    if (k === "w") setNav("window");
    if (k === "e") zoomExtents();
    if (k === "a") { autoFit = true; fit(); draw(); }
  }
  if (e.key === "Backspace") { pts.pop(); draw(); e.preventDefault(); }
  if (e.key === "Delete" && selected) { setValue({ event: "delete", shape: selected, id: uid() }); selected = null; }
  if (e.key === "+" || e.key === "=") zoomAt(canvas.width / 2, canvas.height / 2, 1.25);
  if (e.key === "-") zoomAt(canvas.width / 2, canvas.height / 2, 0.8);
});
canvas.addEventListener("keyup", (e) => { if (e.key === "Shift") shiftDown = false; if (e.key === " ") spaceDown = false; });

document.getElementById("zin").onclick = () => zoomAt(canvas.width / 2, canvas.height / 2, 1.25);
document.getElementById("zout").onclick = () => zoomAt(canvas.width / 2, canvas.height / 2, 0.8);
const refocus = () => canvas.focus({ preventScroll: true });
document.getElementById("pan").onclick = () => { setNav("pan"); refocus(); };
document.getElementById("zwin").onclick = () => { setNav("window"); refocus(); };
document.getElementById("zext").onclick = () => { zoomExtents(); refocus(); };
document.getElementById("zall").onclick = () => { autoFit = true; fit(); draw(); refocus(); };
document.getElementById("undo").onclick = () => { pts.pop(); draw(); canvas.focus({ preventScroll: true }); };
document.getElementById("finish").onclick = () => { finish(); canvas.focus({ preventScroll: true }); };
document.getElementById("cancel").onclick = () => { pts = []; draw(); canvas.focus({ preventScroll: true }); };

send("streamlit:componentReady", { apiVersion: 1 });
</script>
</body>
</html>
